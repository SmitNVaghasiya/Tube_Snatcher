[project]
name = "tube-snatcher"
version = "2.0.0"
description = "Local YouTube downloader: FastAPI + yt-dlp"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-multipart>=0.0.20",
    "yt-dlp[default]>=2026.6.9",
    "imageio-ffmpeg>=0.6",  # bundled ffmpeg fallback when none on PATH
]

[dependency-groups]
dev = ["pytest>=8", "httpx2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
